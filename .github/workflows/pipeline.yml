name: pipeline

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run release -- --check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm install --global opencode-ai@1.19.3 --no-audit --no-fund
      - name: Проверить интеграцию с OpenCode
        env:
          GITWT_REQUIRE_OPENCODE: "1"
        run: node --test test/plugin.test.js

  mirror:
    if: github.event_name == 'push'
    needs: [checks, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mirror to SourceCraft
        env:
          SOURCECRAFT_TOKEN: ${{ secrets.SOURCECRAFT_TOKEN }}
          SOURCECRAFT_OWNER: voischev
        run: bash scripts/mirror-sourcecraft.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - checks
      - integration
      - mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: npm run release
