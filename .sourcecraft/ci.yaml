on:
  push:
    - workflows: [checks]
      filter:
        branches: [main]
    - workflows: [release]
      filter:
        tags: ["v*"]
  pull_request:
    - workflows: [checks]
      filter:
        target_branches: [main]

workflows:
  checks:
    tasks:
      - name: checks
        cubes:
          - name: install
            image: docker.io/library/node:24
            script:
              - npm ci --ignore-scripts --no-audit --no-fund
          - name: lint
            image: docker.io/library/node:24
            needs: [install]
            script:
              - npm run check
          - name: test
            image: docker.io/library/node:24
            needs: [install]
            script:
              - npm test
          - name: pack
            image: docker.io/library/node:24
            needs: [install]
            script:
              - node scripts/release.js --check
  release:
    tasks:
      - name: release
        cubes:
          - name: install
            image: docker.io/library/node:24
            script:
              - npm ci --ignore-scripts --no-audit --no-fund
          - name: lint
            image: docker.io/library/node:24
            needs: [install]
            script:
              - npm run check
          - name: test
            image: docker.io/library/node:24
            needs: [install]
            script:
              - npm test
          - name: publish
            image: docker.io/library/node:24
            needs: [lint, test]
            env:
              NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
            script:
              - node scripts/release.js
